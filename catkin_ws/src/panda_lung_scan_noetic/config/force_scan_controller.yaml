panda_ultrasound_force_scan_controller:
  type: panda_lung_scan_noetic/PandaUltrasoundForceScanController
  arm_id: panda
  joint_names:
    - panda_joint1
    - panda_joint2
    - panda_joint3
    - panda_joint4
    - panda_joint5
    - panda_joint6
    - panda_joint7

  scan_axis: 1
  lateral_axis: 0
  contact_axis: 2

  # Full scan coverage
  scan_length: 0.145
  scan_width: 0.105
  num_passes: 4
  scan_speed: 0.004
  pass_coverage_ratio: 0.75

  # Latest phantom curvature
  curve_half_width: 0.0525
  curve_drop: 0.010

  # Small initial push before force regulation
  contact_offset: -0.0015
  lateral_offset: 0.0

  # Timing
  settle_time: 2.0
  contact_acquire_time: 1.5

  # Force-controlled contact
  desired_contact_force: 2.5
  force_tolerance: 0.5
  force_kp: 0.0008
  force_ki: 0.0002
  max_force_correction: 0.005
  contact_direction_sign: -1.0
  force_filter_alpha: 0.9

  # Path generation
  connector_points: 12
  scan_resolution: 0.003

  # Return motion
  lift_off_distance: 0.008
  return_speed: 0.03

  # Currently not used if tau_nullspace is zeroed in your controller
  nullspace_stiffness: 0.0

  # Stronger XY tracking, softer Z for contact
  cartesian_stiffness: [300.0, 450.0, 60.0, 20.0, 20.0, 20.0]
  cartesian_damping:   [34.6, 42.4, 15.5, 8.9, 8.9, 8.9]