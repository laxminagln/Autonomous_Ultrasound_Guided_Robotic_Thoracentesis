panda_ultrasound_force_scan_controller:
  type: panda_lung_scan_noetic/PandaUltrasoundForceScanController
  arm_id: panda
  joint_names:
    - panda_joint1
    - panda_joint2
    - panda_joint3
    - panda_joint4
    - panda_joint5
    - panda_joint6
    - panda_joint7

  scan_axis: 1
  lateral_axis: 0
  contact_axis: 2

  scan_length: 0.145
  scan_width: 0.105
  num_passes: 4
  scan_speed: 0.003
  pass_coverage_ratio: 1.0

  curve_half_width: 0.0525
  curve_drop: 0.010
  contact_offset: -0.0008
  lateral_offset: 0.0

  settle_time: 2.0
  contact_acquire_time: 3.0

  desired_contact_force: 2.0
  force_tolerance: 0.5
  force_kp: 0.0004
  force_ki: 0.00008
  max_force_correction: 0.0025
  contact_direction_sign: -1.0
  force_filter_alpha: 0.9

  contact_force_enable_ratio: 0.75
  contact_force_trigger: 0.5

  connector_points: 12
  scan_resolution: 0.003

  lift_off_distance: 0.005
  return_speed: 0.02

  nullspace_stiffness: 20.0

  rocking_enable: true
  rocking_gain: 1.0
  rocking_sign: 1.0
  max_rock_angle_deg: 7.0
  rock_rate_limit_deg: 10.0

  cartesian_stiffness: [150.0, 250.0, 40.0, 15.0, 15.0, 15.0]
  cartesian_damping:   [24.5, 31.6, 12.6, 7.7, 7.7, 7.7]